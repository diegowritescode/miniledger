name: miniledger

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: miniledger
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miniledger -d miniledger']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *logging
    networks: [internal]

  api:
    image: ghcr.io/diegowritescode/miniledger-api:${MINILEDGER_IMAGE_TAG:?set MINILEDGER_IMAGE_TAG in deploy/.env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATION_DATABASE_URL: postgres://miniledger:${POSTGRES_PASSWORD}@postgres:5432/miniledger
      DATABASE_URL: postgres://miniledger_app:${APP_DB_PASSWORD}@postgres:5432/miniledger
      ACCESSCORE_BASE_URL: ${ACCESSCORE_URL:?set ACCESSCORE_URL in deploy/.env}
      ACCESSCORE_JWKS_URL: ${ACCESSCORE_URL}/.well-known/jwks.json
      ACCESSCORE_JWT_ISSUER: ${ACCESSCORE_URL}
      ACCESSCORE_JWT_AUDIENCE: accesscore
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 384m
    logging: *logging
    networks: [internal, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.miniledger-api.rule=Host(`${API_HOST:?set API_HOST in deploy/.env}`) && !PathPrefix(`/metrics`)
      - traefik.http.routers.miniledger-api.entrypoints=websecure
      - traefik.http.routers.miniledger-api.tls.certresolver=le
      - traefik.http.services.miniledger-api.loadbalancer.server.port=3000

  web:
    image: ghcr.io/diegowritescode/miniledger-web:${MINILEDGER_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ACCESSCORE_API_URL: ${ACCESSCORE_URL}
      MINILEDGER_API_URL: http://api:3000
    expose: ['3002']
    mem_limit: 256m
    logging: *logging
    networks: [internal, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.miniledger-web.rule=Host(`${WEB_HOST:?set WEB_HOST in deploy/.env}`)
      - traefik.http.routers.miniledger-web.entrypoints=websecure
      - traefik.http.routers.miniledger-web.tls.certresolver=le
      - traefik.http.services.miniledger-web.loadbalancer.server.port=3002

networks:
  internal:
  edge:
    external: true
    name: edge

volumes:
  pgdata:
