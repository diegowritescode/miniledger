name: Mutation

on:
  push:
    branches: [main]
    paths:
      - 'src/ledger/domain/**'
      - 'stryker.conf.json'
      - '.github/workflows/mutation.yml'
  pull_request:
    paths:
      - 'src/ledger/domain/**'
      - 'stryker.conf.json'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
